




volumes:
  shared-workspace:
    name: "cluster_tfg"
services:
  spark-master:
    image: andreper/spark-master
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - shared-workspace:/opt/workspace
    networks:
      - bigdata_movies

  spark-worker-1:
    image: andreper/spark-worker
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1024m
    ports:
      - "8081:8081"
    volumes:
      - shared-workspace:/opt/workspace
    networks:
      - bigdata_movies


  spark-worker-2:
    image: andreper/spark-worker
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1024m
    ports:
      - "8082:8081"
    volumes:
      - shared-workspace:/opt/workspace
    networks:
      - bigdata_movies


  jupyterlab:
    image: andreper/jupyterlab
    container_name: jupyterlab
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    ports:
      - "8888:8888"
    volumes:
      - shared-workspace:/opt/workspace
    networks:
      - bigdata_movies


networks:
  bigdata_movies:
    external: true
